[project]
name = "hdfc-statement-redactor"
version = "0.1.0"
description = "Redact personal info from HDFC credit card statement PDFs"
requires-python = ">=3.13"
dependencies = [
    "pymupdf>=1.24",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
# Sane defaults: E/W = pycodestyle, F = pyflakes, I = import sorting,
# B = bugbear (common bug smells), UP = pyupgrade (modern syntax),
# SIM = simplify, RUF = ruff-specific rules
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]